[alembic]
script_location = migrations
prepend_sys_path = .
# URL is provided programmatically (app.database.migrate); this default is for CLI use.
sqlalchemy.url = sqlite:///./makkadi-dev.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
