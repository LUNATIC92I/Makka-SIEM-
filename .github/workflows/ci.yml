name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m bandit -q -r app -ll
      - run: python -m pip_audit -r requirements.txt
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: makkadi, POSTGRES_DB: makkadi }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt -r requirements-postgres.txt
      - run: python -m pytest -q
        env:
          MAKKADI_TEST_DATABASE_URL: postgresql+psycopg://postgres:makkadi@127.0.0.1:5432/makkadi
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm test
      - run: npm run build
  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r backend/requirements.txt
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Start MAKKADi (demo mode)
        working-directory: backend
        run: |
          MAKKADI_DATA_DIR="$RUNNER_TEMP/makkadi" nohup python -m app.run --port 8765 --static-dir ../frontend/dist > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/v1/health && break; sleep 1; done
      - name: UI end-to-end test
        working-directory: frontend
        run: MAKKADI_URL=http://127.0.0.1:8765/ npm run e2e
      - if: failure()
        run: cat "$RUNNER_TEMP/server.log"
