name: Windows build (.exe)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main", "ccr-e6437631-btar9d"]
permissions:
  contents: read
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build MAKKADi (tests + PyInstaller + Electron)
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Smoke test of the desktop executable (MAKKADi.exe)
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/dist/win-unpacked -Filter MAKKADi.exe | Select-Object -First 1
          if (-not $exe) { throw "MAKKADi.exe introuvable" }
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--remote-debugging-port=9333" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $pages = Invoke-RestMethod "http://127.0.0.1:9333/json/list" -TimeoutSec 3
              $page = $pages | Where-Object { $_.type -eq "page" -and $_.url -like "http://127.0.0.1:*" -and $_.title -eq "MAKKADi" }
              if ($page) {
                $base = ([Uri]$page[0].url).GetLeftPart("Authority")
                $health = Invoke-RestMethod "$base/api/v1/health" -TimeoutSec 3
                Write-Host "Fenêtre chargée : $($page[0].url), backend $($health.app_name) $($health.version) demo=$($health.demo_mode)"
                $ok = $true; break
              }
            } catch { }
          }
          Get-Process | Where-Object { $_.ProcessName -in @("MAKKADi", "makkadi-backend") } | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "MAKKADi.exe n'a pas affiché l'interface" }
          # Electron resolves %APPDATA% through the Windows API (not the environment variable).
          $data = Join-Path ([Environment]::GetFolderPath("ApplicationData")) "MAKKADi\data"
          Get-ChildItem $data -ErrorAction Stop | Format-Table Name, Length
          if (-not (Test-Path (Join-Path $data "master.key.dpapi"))) { throw "Clé maîtresse non protégée par DPAPI" }
          if (Test-Path (Join-Path $data "master.key")) { throw "Clé maîtresse en clair présente" }
          Write-Host "Clés locales protégées par DPAPI : OK"
      - uses: actions/upload-artifact@v4
        with:
          name: makkadi-windows
          path: |
            desktop/dist/*.exe
            backend/dist/makkadi-backend/**
          if-no-files-found: error
